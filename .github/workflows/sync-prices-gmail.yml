# Pipeline programado: Gmail ➔ Descarga Lista Precios ➔ Backend Carlos Isla
# Carlos Isla y Cía. — Portal Clientes

name: Sincronización Automática de Precios desde Gmail

on:
  schedule:
    # Argentina (ART) = UTC-3
    # RESPALDO. El disparo principal lo hace AWS EventBridge (aws/crear-disparador-eventbridge.sh) porque el
    # schedule de GitHub dejó de ser confiable en este repo (ejecutó ~1/3 de las corridas esperadas).
    # Corre cada 2 horas de lunes a sábados, SOLO para PRODUCCIÓN (QA es un entorno de prueba:
    # se actualiza manualmente con "Run workflow" eligiendo QA):
    # Horario Argentina: 07:45, 09:45, 11:45, 13:45, 15:45, 17:45 ART
    # En UTC (+3 hs): 10:45, 12:45, 14:45, 16:45, 18:45, 20:45 UTC
    # El ERP envía el correo con la lista a los :30 de esas mismas horas (cron ERP: 30 7-17/2 * * 1-6),
    # así que :45 deja 15 min de margen para que llegue, y evita los picos de carga de GitHub
    # (inicio de cada hora), que es cuando más se atrasan o se descartan las corridas programadas.
    # OJO: el schedule de GitHub es "best effort": se atrasa y a veces se saltea corridas.
    # El disparo puntual lo hace AWS EventBridge Scheduler vía workflow_dispatch (ver README);
    # este cron queda de respaldo (con etiquetas por entorno, un doble disparo no hace daño).
    - cron: '45 10,12,14,16,18,20 * * 1-6'
  workflow_dispatch:
    inputs:
      target_env:
        type: choice
        description: 'Entorno de destino para la sincronización'
        options:
          - QA
          - PROD
          - AMBOS
        default: QA
      gmail_query:
        description: 'Query opcional de Gmail (ej: subject:"Portal Clientes - Precios")'
        required: false
        default: ''

# Evita que dos ejecuciones (cron + manual) procesen el mismo correo a la vez.
# Sin cancelar la que está corriendo: una sincronización a medias no debe interrumpirse.
concurrency:
  group: sync-prices
  cancel-in-progress: false

jobs:
  sync-prices:
    name: Descargar Excel de Gmail y Sincronizar en Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Restaurar credenciales OAuth si existen
        env:
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN_JSON || secrets.GMAIL_TOKEN_VENTAS_JSON }}
        run: |
          if [ -n "$GMAIL_CREDENTIALS" ]; then
            echo "$GMAIL_CREDENTIALS" > credentials.json
          fi
          if [ -n "$GMAIL_TOKEN" ]; then
            echo "$GMAIL_TOKEN" > token.json
          fi

      - name: Ejecutar sincronización de precios
        env:
          # Programado (schedule / EventBridge sin input): solo PRODUCCIÓN. QA se actualiza a mano.
          TARGET_ENV: ${{ github.event.inputs.target_env || 'PROD' }}
          BACKEND_SYNC_URL_QA: ${{ secrets.BACKEND_SYNC_URL_QA || secrets.BACKEND_SYNC_URL || 'https://qa-api.clientes.carlosisla.com.ar/products/sync' }}
          EXTERNAL_SYNC_API_KEY_QA: ${{ secrets.EXTERNAL_SYNC_API_KEY_QA || secrets.EXTERNAL_SYNC_API_KEY }}
          BACKEND_SYNC_URL_PROD: ${{ secrets.BACKEND_SYNC_URL_PROD || secrets.BACKEND_SYNC_URL || 'https://api-clientes.carlosisla.com.ar/products/sync' }}
          EXTERNAL_SYNC_API_KEY_PROD: ${{ secrets.EXTERNAL_SYNC_API_KEY_PROD || secrets.EXTERNAL_SYNC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_SUBJECT_FILTER: ${{ secrets.GMAIL_SUBJECT_FILTER || 'Portal Clientes - Precios' }}
          GMAIL_LABEL_PROCESADO: ${{ secrets.GMAIL_LABEL_PROCESADO || 'PORTAL_PRECIOS_ACTUALIZADOS' }}
          GMAIL_LABEL_QA: ${{ secrets.GMAIL_LABEL_QA || 'PORTAL_PRECIOS_QA' }}
          GMAIL_LABEL_PROD: ${{ secrets.GMAIL_LABEL_PROD || 'PORTAL_PRECIOS_PROD' }}
          GMAIL_SEARCH_QUERY: ${{ github.event.inputs.gmail_query }}
        run: |
          python sync_prices_from_gmail.py
